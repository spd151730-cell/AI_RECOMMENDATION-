<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLEAI - Why This Outfit?</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .stApp { min-height: 100vh; }
        .main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
        
        .score-box {
            background: #ffffff; border: 1px solid rgba(103, 80, 154, 0.12); border-radius: 16px;
            padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 8px 24px rgba(45, 30, 65, 0.05);
        }
        
        .progress-bar { width: 100%; height: 8px; background: #e0d5f5; border-radius: 999px; overflow: hidden; margin-top: 0.3rem; }
        .progress-fill { display: block; height: 100%; background: linear-gradient(90deg, #6b4bb0, #ef7d8f); border-radius: 999px; }

        .explain-card {
            background: #ffffff; border: 1px solid rgba(103, 80, 154, 0.12); border-radius: 12px;
            padding: 1.2rem; margin-bottom: 0.7rem;
        }
        .explain-card h4 { margin: 0 0 0.4rem 0; font-size: 1.05rem; font-weight: 800; color: #1b1528; }
        .explain-card p { margin: 0; font-size: 0.9rem; color: #625b6e; }

        .btn-controls { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; }
        .stButton button { padding: 0.8rem 1.2rem; width: 100%; border-radius: 14px; font-weight: 800; cursor: pointer; font-size:0.9rem;}
        .btn-primary { background: linear-gradient(135deg, #6a4bb0, #ef7d8f); color: white; border: none; }
        .btn-secondary { background: #f5efff; color: #2d174d; border: 1.5px solid rgba(107, 75, 176, 0.25); }
    </style>
</head>
<body class="stApp">
    <div class="main block-container">
        <div id="nav-container" 
             data-title="Why This Outfit?" 
             data-subtitle="A clearer, structured explanation of how the recommendation fits your choice." 
             data-badge="StyleAI" 
             data-active="10 Why">
        </div>

        <div class="score-box" style="margin-top:2rem;">
            <div class="page-kicker" style="margin-bottom:0.2rem;">Overall match</div>
            <div style="font-size:2.5rem; font-weight:900; color:#1d1528;" id="overall-score">...</div>
        </div>

        <div id="breakdown-list">
            <!-- Injected via JS -->
        </div>

        <div class="page-kicker" style="margin-top:1.5rem; margin-bottom:0.8rem;">✨ Why it suits you</div>
        
        <div id="explain-list">
            <!-- Injected via JS -->
        </div>

        <div class="score-box" style="background:linear-gradient(135deg, rgba(110,83,170,0.08), rgba(239,125,143,0.08)); margin-top:1.5rem;">
            <div class="page-kicker">AI stylist summary</div>
            <div style="font-size:1.05rem; font-weight:700; color:#20192d; line-height:1.6; font-style:italic;">
                "This combination balances your selected style, occasion and budget while keeping the outfit visually coordinated."
            </div>
        </div>

        <div class="btn-controls">
            <div class="stButton" style="width: 300px;">
                <button class="btn-secondary" onclick="window.location.href='pairing.html'">← Back to Pairing</button>
            </div>
            <div class="stButton" style="width: 300px;">
                <button class="btn-primary" onclick="window.location.href='preview.html'">Virtual Styling Preview →</button>
            </div>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="../js/explanation.js"></script>
</body>
</html>
